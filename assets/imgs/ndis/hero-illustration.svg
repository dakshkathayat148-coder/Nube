<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ED4235" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4185F7" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="350" rx="24" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="50" cy="60" r="50" fill="#ED4235" opacity="0.08"/>
  <circle cx="350" cy="300" r="60" fill="#4185F7" opacity="0.06"/>
  <circle cx="320" cy="70" r="25" fill="#F9BE05" opacity="0.1"/>
  <!-- Laptop illustration -->
  <rect x="100" y="80" width="200" height="120" rx="12" fill="url(#card1)" stroke="#e0e7ff" stroke-width="2"/>
  <rect x="110" y="90" width="180" height="85" rx="4" fill="#1a1a2e"/>
  <rect x="110" y="90" width="180" height="85" rx="4" fill="url(#bg)" opacity="0.3"/>
  <!-- Screen content -->
  <rect x="125" y="105" width="50" height="7" rx="3" fill="#ED4235" opacity="0.7"/>
  <rect x="125" y="118" width="70" height="3" rx="2" fill="#fff" opacity="0.5"/>
  <rect x="125" y="126" width="60" height="3" rx="2" fill="#fff" opacity="0.4"/>
  <rect x="125" y="134" width="80" height="3" rx="2" fill="#fff" opacity="0.4"/>
  <rect x="125" y="148" width="35" height="16" rx="4" fill="#ED4235" opacity="0.6"/>
  <rect x="165" y="148" width="35" height="16" rx="4" fill="#4185F7" opacity="0.5"/>
  <rect x="205" y="148" width="35" height="16" rx="4" fill="#F9BE05" opacity="0.5"/>
  <line x1="110" y1="183" x2="290" y2="183" stroke="#333" stroke-width="2" opacity="0.3"/>
  <!-- Laptop base -->
  <path d="M120 200 L140 225 L260 225 L280 200" fill="url(#card1)" stroke="#e0e7ff" stroke-width="2"/>
  <!-- NDIS badge -->
  <circle cx="300" cy="110" r="24" fill="#ED4235" opacity="0.9"/>
  <text x="300" y="115" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="Arial">NDIS</text>
  <!-- Shield icon -->
  <path d="M200 255 L215 249 L215 260 C215 270 200 276 200 276 C200 276 185 270 185 260 L185 249 Z" fill="#ED4235" opacity="0.15" stroke="#ED4235" stroke-width="1.5"/>
  <path d="M194 258 L198 262 L206 254" stroke="#ED4235" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>
  <!-- Decorative elements -->
  <rect x="70" y="240" width="6" height="6" rx="2" fill="#ED4235" opacity="0.15"/>
  <rect x="320" y="200" width="5" height="5" rx="2" fill="#4185F7" opacity="0.15"/>
  <rect x="60" y="295" width="8" height="8" rx="3" fill="#F9BE05" opacity="0.1"/>
  <!-- Stars -->
  <text x="350" y="140" fill="#F9BE05" opacity="0.3" font-size="12">★</text>
  <text x="60" y="190" fill="#F9BE05" opacity="0.2" font-size="10">★</text>
</svg>
