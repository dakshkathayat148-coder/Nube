<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ED4235" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4185F7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="laptop-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#f8f9fc"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" rx="24" fill="url(#g1)"/>
  <circle cx="530" cy="60" r="80" fill="#ED4235" opacity="0.04"/>
  <circle cx="70" cy="370" r="60" fill="#4185F7" opacity="0.04"/>
  <!-- Laptop -->
  <rect x="120" y="60" width="360" height="230" rx="16" fill="url(#card-grad)" stroke="#e8e8ef" stroke-width="2"/>
  <!-- Screen -->
  <rect x="135" y="75" width="330" height="180" rx="8" fill="url(#laptop-bg)"/>
  <!-- Website mockup on screen -->
  <rect x="150" y="90" width="100" height="12" rx="4" fill="#ED4235" opacity="0.8"/>
  <rect x="150" y="110" width="80" height="6" rx="3" fill="#fff" opacity="0.3"/>
  <rect x="150" y="122" width="60" height="6" rx="3" fill="#fff" opacity="0.2"/>
  <!-- Hero image placeholder -->
  <rect x="150" y="140" width="140" height="60" rx="6" fill="#ED4235" opacity="0.12"/>
  <rect x="150" y="140" width="140" height="60" rx="6" fill="#ED4235" opacity="0.08"/>
  <!-- Content lines -->
  <rect x="150" y="210" width="120" height="4" rx="2" fill="#fff" opacity="0.25"/>
  <rect x="150" y="218" width="100" height="4" rx="2" fill="#fff" opacity="0.2"/>
  <rect x="150" y="226" width="110" height="4" rx="2" fill="#fff" opacity="0.2"/>
  <!-- Right column content on screen -->
  <rect x="310" y="90" width="140" height="8" rx="4" fill="#fff" opacity="0.3"/>
  <rect x="310" y="105" width="120" height="4" rx="2" fill="#fff" opacity="0.2"/>
  <rect x="310" y="115" width="130" height="4" rx="2" fill="#fff" opacity="0.2"/>
  <rect x="310" y="130" width="80" height="4" rx="2" fill="#fff" opacity="0.2"/>
  <rect x="310" y="150" width="90" height="30" rx="6" fill="#ED4235" opacity="0.6"/>
  <rect x="310" y="190" width="100" height="4" rx="2" fill="#fff" opacity="0.2"/>
  <rect x="310" y="198" width="90" height="4" rx="2" fill="#fff" opacity="0.2"/>
  <!-- Laptop base -->
  <path d="M150 290 L175 325 L425 325 L450 290" fill="url(#card-grad)" stroke="#e8e8ef" stroke-width="2"/>
  <!-- Elegant floating badge -->
  <rect x="460" y="120" width="100" height="36" rx="18" fill="#fff" stroke="#ED4235" stroke-width="1.5"/>
  <circle cx="478" cy="138" r="10" fill="#ED4235"/>
  <text x="478" y="142" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold" font-family="Arial">✓</text>
  <text x="492" y="142" fill="#1D1D1D" font-size="11" font-weight="600" font-family="Arial">Elegant</text>
  <!-- Decorative dots -->
  <circle cx="80" cy="100" r="4" fill="#ED4235" opacity="0.15"/>
  <circle cx="520" cy="350" r="5" fill="#4185F7" opacity="0.1"/>
  <circle cx="90" cy="280" r="3" fill="#F9BE05" opacity="0.2"/>
</svg>
